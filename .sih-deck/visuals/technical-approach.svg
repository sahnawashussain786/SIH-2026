    <rect x="1090" y="428" width="180" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B"/>
    <path d="M1102 443 h20 M1102 443 l5 -5 M1102 443 l5 5" stroke="#F59E0B" stroke-width="3" fill="none"/>
    <text x="1136" y="448" font-size="13" fill="#B45309" font-weight="bold">AUDIT LOG</text>
