  <rect x="170" y="545" width="380" height="230" rx="14" fill="#F8FAFC" stroke="#0E7490" stroke-width="2"/>
  <g transform="translate(250,615)">
    <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#0E7490"/>
    <path d="M-18 -16 h10 M8 -16 h10 M-18 16 h10 M8 16 h10 M-16 -16 v-14 h32 v14 M-16 16 v14 h32 v-14 M-16 -16 v32 M16 -16 v32" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
    <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
  </g>
  <text x="310" y="598" font-size="19" font-weight="bold" fill="#1A1A1A">AI ENGINE</text>
  <g font-size="13" font-weight="bold" fill="#0E7490">
    <rect x="310" y="618" width="86" height="28" rx="14" fill="#E6F4F7"/><text x="330" y="637">OCR</text>
    <rect x="404" y="618" width="72" height="28" rx="14" fill="#E6F4F7"/><text x="422" y="637">NLP</text>
    <rect x="484" y="618" width="58" height="28" rx="14" fill="#E6F4F7"/><text x="494" y="637">CV</text>
  </g>
  <text x="192" y="690" font-size="14" fill="#64748B">Tesseract · Google Vision</text>
  <text x="192" y="714" font-size="14" fill="#64748B">spaCy · HuggingFace · OpenCV</text>
  <text x="192" y="744" font-size="13" fill="#94A3B8">Pre-process → Extract → Classify</text>

  <!-- verification -->
  <rect x="610" y="545" width="380" height="230" rx="14" fill="#FFF7E6" stroke="#F59E0B" stroke-width="2"/>
  <g transform="translate(690,615)">
    <circle cx="0" cy="-14" r="15" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M-24 26 c0 -18 10 -26 24 -26 s24 8 24 26" fill="none" stroke="#F59E0B" stroke-width="4"/>
  </g>
  <g transform="translate(748,600)">
    <path d="M-16 0 l-12 -14 6 -6 8 9 16 -18 7 6 z" fill="#15803D"/>
    <circle r="22" fill="none" stroke="#15803D" stroke-width="3.5"/>
  </g>
  <text x="780" y="598" font-size="19" font-weight="bold" fill="#1A1A1A">VERIFICATION</text>
  <text x="780" y="624" font-size="14" fill="#64748B">Human-in-the-loop</text>
  <text x="632" y="690" font-size="14" fill="#64748B">Confidence scoring on every field</text>
  <text x="632" y="714" font-size="14" fill="#64748B">Low confidence → officer review</text>
  <text x="632" y="744" font-size="13" fill="#94A3B8">Immutable audit trail</text>

  <!-- databases -->
  <rect x="1050" y="545" width="380" height="230" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <g transform="translate(1130,610)">
    <ellipse cx="0" cy="-30" rx="34" ry="12" fill="#15803D"/>
    <path d="M-34 -30 v56 c0 7 15 12 34 12 s34 -5 34 -12 v-56" fill="#15803D"/>
    <path d="M-34 -14 c0 7 15 12 34 12 s34 -5 34 -12 M-34 2 c0 7 15 12 34 12 s34 -5 34 -12" stroke="#FFFFFF" stroke-width="3" fill="none"/>
