  <text x="1190" y="624" font-size="14" fill="#64748B">MongoDB</text>
  <text x="1072" y="690" font-size="14" fill="#64748B">Structured land records</text>
  <text x="1072" y="714" font-size="14" fill="#64748B">Documents &amp; users</text>
  <text x="1072" y="744" font-size="13" fill="#94A3B8">Cross-check validation</text>

