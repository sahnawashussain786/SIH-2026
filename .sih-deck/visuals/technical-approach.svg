  <g stroke="#0E7490" stroke-width="4" fill="#0E7490">
    <line x1="360" y1="480" x2="360" y2="525"/><polygon points="360,535 351,520 369,520"/>
    <line x1="800" y1="480" x2="800" y2="525"/><polygon points="800,535 791,520 809,520"/>
    <line x1="1240" y1="480" x2="1240" y2="525"/><polygon points="1240,535 1231,520 1249,520"/>
  </g>

