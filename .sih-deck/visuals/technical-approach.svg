  <g>
    <rect x="1090" y="388" width="180" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B"/>
    <path d="M1108 395 l9 -6 9 6 v8 c0 6 -9 10 -9 10 s-9 -4 -9 -10 z" fill="#F59E0B"/>
