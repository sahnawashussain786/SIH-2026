<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;padding:8px;font-family:Arial}</style></head><body><svg style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="58" font-size="30" font-weight="bold" fill="#1A1A1A" letter-spacing="2">BHOOMI-AI — FEASIBILITY &amp; VIABILITY</text>
  <rect x="60" y="72" width="150" height="5" fill="#F59E0B"/>

  <!-- ═══════════ LEFT HALF: BALANCE SCALE ═══════════ -->
  <!-- pillar -->
  <rect x="392" y="290" width="26" height="330" fill="#334155"/>
  <rect x="330" y="620" width="150" height="18" rx="6" fill="#334155"/>

  <!-- beam (tilted: right side heavier = solution wins) -->
  <g transform="rotate(-9 405 285)">
    <rect x="105" y="276" width="600" height="14" rx="7" fill="#1E293B"/>
  </g>
  <!-- fulcrum cap -->
  <circle cx="405" cy="283" r="16" fill="#F59E0B"/>

  <!-- LEFT PAN: challenges (up = lighter) -->
  <g>
    <!-- strings -->
    <line x1="170" y1="296" x2="230" y2="415" stroke="#94A3B8" stroke-width="3"/>
    <line x1="170" y1="296" x2="110" y2="415" stroke="#94A3B8" stroke-width="3"/>
    <!-- pan -->
    <path d="M40 415 H300 A130 130 0 0 1 40 415 Z" fill="#F1F5F9" stroke="#B91C1C" stroke-width="3"/>
    <!-- messy paper pile -->
    <g transform="translate(170,352)">
      <rect x="-78" y="-24" width="72" height="46" rx="4" fill="#E2E8F0" stroke="#CBD5E1" transform="rotate(-14)"/>
      <rect x="-24" y="-30" width="72" height="48" rx="4" fill="#CBD5E1" stroke="#94A3B8" transform="rotate(7)"/>
      <rect x="26" y="-24" width="64" height="42" rx="4" fill="#E2E8F0" stroke="#CBD5E1" transform="rotate(-4)"/>
      <path d="M-34 -6 l10 8 M44 -14 l8 10" stroke="#94A3B8" stroke-width="2.5"/>
    </g>
    <!-- warning sparks -->
    <g fill="#B91C1C" font-weight="bold">
      <circle cx="70" cy="330" r="13"/><text x="70" y="336" text-anchor="middle" font-size="16" fill="#FFFFFF">!</text>
      <circle cx="268" cy="318" r="13"/><text x="268" y="324" text-anchor="middle" font-size="16" fill="#FFFFFF">!</text>
    </g>
    <!-- labels under pan -->
    <text x="170" y="580" text-anchor="middle" font-size="19" font-weight="bold" fill="#B91C1C" letter-spacing="1">CHALLENGES</text>
    <g font-size="14.5" fill="#334155" text-anchor="middle">
      <text x="170" y="608">Faded scans · mixed scripts</text>
      <text x="170" y="630">Legacy LRMS integration</text>
    </g>
  </g>

  <!-- RIGHT PAN: solution (down = heavier) -->
  <g>
    <line x1="640" y1="240" x2="700" y2="360" stroke="#94A3B8" stroke-width="3"/>
    <line x1="640" y1="240" x2="580" y2="360" stroke="#94A3B8" stroke-width="3"/>
    <!-- pan -->
    <path d="M510 360 H770 A130 130 0 0 1 510 360 Z" fill="#E6F4F7" stroke="#0E7490" stroke-width="3"/>
    <!-- tablet with verified record -->
    <g transform="translate(640,300)">
      <rect x="-52" y="-36" width="104" height="72" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="3"/>
      <rect x="-38" y="-20" width="42" height="7" rx="3.5" fill="#0E7490"/>
      <rect x="-38" y="-6" width="56" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="-38" y="6" width="48" height="6" rx="3" fill="#CBD5E1"/>
      <path d="M14 8 l9 9 16 -18" stroke="#15803D" stroke-width="5" fill="none"/>
      <circle cx="24" cy="8" r="17" fill="none" stroke="#15803D" stroke-width="3"/>
    </g>
    <text x="640" y="545" text-anchor="middle" font-size="19" font-weight="bold" fill="#0E7490" letter-spacing="1">BHOOMI-AI SOLUTION</text>
    <g font-size="14.5" fill="#334155" text-anchor="middle">
      <text x="640" y="573">MERN + mature AI models</text>
      <text x="640" y="595">Low-cost cloud deployment</text>
    </g>
    <!-- weight glow -->
    <circle cx="640" cy="360" r="6" fill="#F59E0B"/>
  </g>

  <!-- center verdict badge -->
  <g transform="translate(405,742)">
    <rect x="-190" y="-30" width="380" height="60" rx="30" fill="#0E7490"/>
    <path d="M-150 0 l11 11 22 -24" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <text x="-100" y="7" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="1">SOLUTION OUTWEIGHS CHALLENGES</text>
  </g>

  <!-- divider -->
  <line x1="830" y1="120" x2="830" y2="780" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="4 10"/>

  <!-- ═══════════ RIGHT HALF: 3 MITIGATION PILLARS VIADUCT ═══════════ -->
  <text x="900" y="130" font-size="19" font-weight="bold" fill="#0E7490" letter-spacing="2">HOW CHALLENGES ARE HANDLED</text>

  <!-- road deck (the viability outcome) -->
  <rect x="890" y="560" width="640" height="26" rx="6" fill="#1E293B"/>
  <rect x="890" y="586" width="640" height="10" rx="4" fill="#334155"/>
  <g fill="#F59E0B">
    <rect x="940" y="571" width="34" height="5" rx="2"/>
    <rect x="1020" y="571" width="34" height="5" rx="2"/>
    <rect x="1100" y="571" width="34" height="5" rx="2"/>
    <rect x="1180" y="571" width="34" height="5" rx="2"/>
    <rect x="1260" y="571" width="34" height="5" rx="2"/>
    <rect x="1340" y="571" width="34" height="5" rx="2"/>
    <rect x="1420" y="571" width="34" height="5" rx="2"/>
  </g>
  <!-- car carrying record -->
  <g transform="translate(1330,522)">
    <rect x="-42" y="-8" width="84" height="26" rx="8" fill="#0E7490"/>
    <path d="M-22 -8 L-10 -26 H22 L34 -8 Z" fill="#0E7490"/>
    <rect x="-6" y="-22" width="24" height="14" rx="3" fill="#E6F4F7"/>
    <circle cx="-24" cy="20" r="9" fill="#1E293B" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="26" cy="20" r="9" fill="#1E293B" stroke="#94A3B8" stroke-width="3"/>
  </g>
  <text x="1210" y="622" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">VIABLE ROAD TO DEPLOYMENT</text>
  <text x="1210" y="644" text-anchor="middle" font-size="13.5" fill="#64748B">adoptable state-by-state · extensible to other domains</text>

  <!-- pillar 1 -->
  <g>
    <rect x="920" y="316" width="140" height="244" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5"/>
    <circle cx="990" cy="368" r="26" fill="#15803D"/>
    <path d="M977 368 l9 9 18 -20" stroke="#FFFFFF" stroke-width="4.5" fill="none"/>
    <text x="990" y="424" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#166534">PRE-PROCESS</text>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="990" y="448">Image enhancement</text>
      <text x="990" y="468">Deskew · denoise</text>
      <text x="990" y="488">Contrast restore</text>
    </g>
  </g>
  <!-- pillar 2 -->
  <g>
    <rect x="1140" y="316" width="140" height="244" rx="10" fill="#E6F4F7" stroke="#0E7490" stroke-width="2.5"/>
    <circle cx="1210" cy="368" r="26" fill="#0E7490"/>
    <path d="M1196 372 l8 -12 6 8 6 -14 8 18" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
    <circle cx="1210" cy="368" r="3.5" fill="#F59E0B"/>
    <text x="1210" y="424" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0E7490">AI CONFIDENCE</text>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="1210" y="448">Per-field score</text>
      <text x="1210" y="468">Cross-DB checks</text>
      <text x="1210" y="488">Auto-save high conf.</text>
    </g>
  </g>
  <!-- pillar 3 -->
  <g>
    <rect x="1360" y="316" width="140" height="244" rx="10" fill="#FFF7E6" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="1430" cy="368" r="26" fill="#F59E0B"/>
    <circle cx="1430" cy="362" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M1416 380 c0 -10 7 -15 14 -15 s14 5 14 15" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="1430" y="424" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#B45309">HUMAN REVIEW</text>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="1430" y="448">Officer one-click verify</text>
      <text x="1430" y="468">Only low-confidence</text>
      <text x="1430" y="488">Full audit trail</text>
    </g>
  </g>

  <!-- arrows from pillars up to deck -->
  <g stroke="#94A3B8" stroke-width="3" fill="#94A3B8">
    <line x1="990" y1="316" x2="990" y2="296"/><polygon points="990,290 982,304 998,304"/>
    <line x1="1210" y1="316" x2="1210" y2="296"/><polygon points="1210,290 1202,304 1218,304"/>
    <line x1="1430" y1="316" x2="1430" y2="296"/><polygon points="1430,290 1422,304 1438,304"/>
  </g>
  <text x="1210" y="278" text-anchor="middle" font-size="13" fill="#94A3B8" font-style="italic">pillars carry the platform</text>

  <!-- bottom strip -->
  <rect x="60" y="812" width="1480" height="52" rx="10" fill="#F1F5F9"/>
  <text x="800" y="845" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">FEASIBLE: proven stack + available AI models   ·   VIABLE: modular, state-by-state adoption, API-ready for LRMS/DILRMP integration</text>
</svg>
</body></html>
